<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Particle Synthesis Engine</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background:#080c10;
  color:#aab;
  font-family:'Courier New',monospace;
  font-size:12px;
  overflow:hidden;
  height:100vh;
  display:flex;
}

/* ── Panel ──────────────────────────────────────────────────── */
#panel {
  width:210px;
  min-width:210px;
  background:#0a0f16;
  border-right:1px solid #1e2a3a;
  padding:14px;
  display:flex;
  flex-direction:column;
  gap:10px;
  overflow-y:auto;
}

#panel h2 {
  font-size:10px;
  color:#3af;
  letter-spacing:3px;
  border-bottom:1px solid #1a2535;
  padding-bottom:6px;
  margin-top:4px;
}

.ctrl { display:flex; flex-direction:column; gap:4px; }

.ctrl label {
  color:#667;
  font-size:10px;
  letter-spacing:1px;
  display:flex;
  justify-content:space-between;
}
.ctrl label span { color:#3af; font-weight:bold; }

input[type=range] {
  width:100%;
  height:3px;
  -webkit-appearance:none;
  appearance:none;
  background:#1e2a3a;
  outline:none;
  cursor:pointer;
  border-radius:2px;
}
input[type=range]::-webkit-slider-thumb {
  -webkit-appearance:none;
  width:12px;
  height:12px;
  background:#3af;
  border-radius:50%;
  cursor:pointer;
}

.btn {
  background:#0a0f16;
  border:1px solid #1e3050;
  color:#3af;
  padding:6px 8px;
  cursor:pointer;
  font-family:'Courier New',monospace;
  font-size:10px;
  letter-spacing:1px;
  width:100%;
  transition:all 0.1s;
}
.btn:hover { background:#1a2535; border-color:#3af; }
.btn:active { background:#3af; color:#000; }
.btn:disabled { opacity:0.35; cursor:not-allowed; }

.row { display:flex; gap:6px; }
.row .btn { flex:1; }

select {
  background:#0a0f16;
  border:1px solid #1e3050;
  color:#3af;
  padding:5px;
  font-family:'Courier New',monospace;
  font-size:10px;
  width:100%;
  cursor:pointer;
  outline:none;
}

.toggle-row {
  display:flex;
  align-items:center;
  gap:8px;
}
.toggle-row input[type=checkbox] {
  accent-color:#3af;
  cursor:pointer;
  width:13px;
  height:13px;
}
.toggle-row span { color:#667; font-size:10px; letter-spacing:1px; }

#status {
  font-size:10px;
  color:#445;
  margin-top:auto;
  border-top:1px solid #1a2535;
  padding-top:10px;
  line-height:1.9;
}
#status span { color:#3af; }

#startBtn.running { border-color:#3fa; color:#3fa; }

/* ── Canvas area ─────────────────────────────────────────────── */
#canvasWrap {
  flex:1;
  position:relative;
  display:flex;
  flex-direction:column;
  min-width:0;
}

canvas { display:block; }

#scope { height:60px; background:#050810; }
</style>
</head>
<body>

<div id="panel">
  <div style="color:#3af;font-size:11px;letter-spacing:2px;font-weight:bold;padding-bottom:4px;">PARTICLE SYNTH</div>

  <h2>PHYSICS</h2>
  <div class="ctrl">
    <label>GRAVITY <span id="gv">0.08</span></label>
    <input type="range" id="gravity" min="0" max="0.5" step="0.01" value="0.08">
  </div>
  <div class="ctrl">
    <label>WIND <span id="wv">0.00</span></label>
    <input type="range" id="wind" min="-0.3" max="0.3" step="0.01" value="0">
  </div>
  <div class="ctrl">
    <label>VISCOSITY <span id="vv">0.98</span></label>
    <input type="range" id="viscosity" min="0.8" max="1.0" step="0.005" value="0.98">
  </div>
  <div class="ctrl">
    <label>BOUNCINESS <span id="bv">0.75</span></label>
    <input type="range" id="bounce" min="0.1" max="1.0" step="0.05" value="0.75">
  </div>

  <h2>SYNTHESIS</h2>
  <div class="ctrl">
    <label>FM DEPTH <span id="fv">3.0</span></label>
    <input type="range" id="fmdepth" min="0" max="12" step="0.5" value="3">
  </div>
  <div class="ctrl">
    <label>GRAIN DENSITY <span id="gdv">0.5</span></label>
    <input type="range" id="graindensity" min="0" max="1" step="0.05" value="0.5">
  </div>
  <div class="ctrl">
    <label>MASTER VOL <span id="mvv">0.60</span></label>
    <input type="range" id="mastervol" min="0" max="1" step="0.05" value="0.6">
  </div>
  <div class="ctrl">
    <label>REVERB <span id="rvv">0.35</span></label>
    <input type="range" id="reverbamt" min="0" max="1" step="0.05" value="0.35">
  </div>

  <div style="font-size:10px;color:#667;letter-spacing:1px;">GRAIN TYPE</div>
  <select id="graintype">
    <option value="droplet">DROPLET</option>
    <option value="pluck">PLUCK</option>
    <option value="noise">NOISE</option>
  </select>

  <div class="toggle-row">
    <input type="checkbox" id="bubbleOn" checked>
    <span>BUBBLE RESONANCE</span>
  </div>

  <h2>CONTROL</h2>
  <button class="btn" id="disturbBtn">⚡ DISTURBANCE</button>
  <div class="row">
    <button class="btn" id="addBtn">+ PARTICLE</button>
    <button class="btn" id="resetBtn">RESET</button>
  </div>
  <button class="btn" id="startBtn">▶ START AUDIO</button>

  <div id="status">
    PARTICLES: <span id="pcount">0</span><br>
    AUDIO: <span id="audstat">STOPPED</span><br>
    <br>
    CLICK+HOLD → ATTRACTOR<br>
    MAX PARTICLES: 24
  </div>
</div>

<div id="canvasWrap">
  <canvas id="main"></canvas>
  <canvas id="scope"></canvas>
</div>

<script>
'use strict';

// ─────────────────────────────────────────────────────────────
// Canvas setup
// ─────────────────────────────────────────────────────────────

const canvas     = document.getElementById('main');
const ctx        = canvas.getContext('2d');
const scopeCv    = document.getElementById('scope');
const sctx       = scopeCv.getContext('2d');
const wrap       = document.getElementById('canvasWrap');

let W = 1, H = 1;

function resize() {
  const r = wrap.getBoundingClientRect();
  W = r.width;
  H = r.height - 60;
  canvas.width  = W;  canvas.height = H;
  scopeCv.width = W;  scopeCv.height = 60;
}
resize();
window.addEventListener('resize', resize);

// ─────────────────────────────────────────────────────────────
// Audio
// ─────────────────────────────────────────────────────────────

let AC           = null;
let masterGain   = null;
let limiter      = null;
let reverb       = null;
let reverbGain   = null;
let analyser     = null;
let audioStarted = false;

const MAX_P = 24;
const particles = [];

// Warmth → Hz (80 → 800)
function warmthToFreq(w) {
  return 80 * Math.pow(10, Math.max(0, Math.min(1, w)));
}

function warmthToColor(w, alpha) {
  alpha = alpha !== undefined ? alpha : 1;
  const h = w < 0.5
    ? 200 + w * 80
    : 240 - (w - 0.5) * 280;
  return `hsla(${Math.round(h)},80%,${40 + w * 20}%,${alpha})`;
}

function buildReverb(ac) {
  const len = ac.sampleRate * 3;
  const buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++)
      d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2.2);
  }
  const conv = ac.createConvolver();
  conv.buffer = buf;
  return conv;
}

// Grain synthesis — fired on collision
function spawnGrain(freq, type) {
  if (!audioStarted) return;
  try {
    const sr  = AC.sampleRate;
    const dur = 0.025 + Math.random() * 0.1;
    const len = Math.floor(sr * dur);
    const buf = AC.createBuffer(1, len, sr);
    const d   = buf.getChannelData(0);

    if (type === 'droplet') {
      for (let i = 0; i < len; i++)
        d[i] = Math.sin(2 * Math.PI * freq * i / sr) * Math.exp(-i / sr * 28) * 0.85;

    } else if (type === 'pluck') {
      // Karplus-Strong: noise burst filtered through a delay loop
      const delayLen = Math.max(2, Math.round(sr / freq));
      const ring = new Float32Array(delayLen);
      for (let i = 0; i < delayLen; i++) ring[i] = Math.random() * 2 - 1;
      for (let i = 0; i < len; i++) {
        const idx = i % delayLen;
        d[i] = ring[idx];
        ring[idx] = 0.5 * (ring[idx] + ring[(idx + 1) % delayLen]);
      }
      // Fade out
      for (let i = 0; i < len; i++) d[i] *= Math.exp(-i / len * 4);

    } else { // noise
      for (let i = 0; i < len; i++)
        d[i] = (Math.random() * 2 - 1) * Math.exp(-i / len * 12) * 0.7;
    }

    const src = AC.createBufferSource();
    src.buffer = buf;
    src.playbackRate.value = 0.88 + Math.random() * 0.24;
    const g = AC.createGain();
    g.gain.value = 0.28;
    src.connect(g);
    g.connect(masterGain);
    src.start();
    src.stop(AC.currentTime + dur + 0.06);
  } catch (_) {}
}

// ─────────────────────────────────────────────────────────────
// Particle
// ─────────────────────────────────────────────────────────────

class Particle {
  constructor(x, y, warmth, tension) {
    this.x       = x;
    this.y       = y;
    this.vx      = (Math.random() - 0.5) * 3;
    this.vy      = (Math.random() - 0.5) * 3;
    this.warmth  = warmth;
    this.tension = tension;
    this.mass    = 1 + tension;
    this.r       = 6 + tension * 10;

    // Audio nodes (null until initAudio)
    this.osc     = null;
    this.fmOsc   = null; // dedicated FM modulator per particle
    this.fmGain  = null;
    this.filter  = null;
    this.oscGain = null;

    this.lastGrainTime = 0;

    if (audioStarted) this.initAudio();
  }

  initAudio() {
    try {
      // Carrier chain: osc → filter → oscGain → masterGain
      this.osc = AC.createOscillator();
      this.filter = AC.createBiquadFilter();
      this.filter.type = 'bandpass';
      this.oscGain = AC.createGain();
      this.oscGain.gain.value = 0;

      // Dedicated FM oscillator: fmOsc → fmGain → osc.frequency
      // This is wired once and stays wired — gain amplitude controls depth
      this.fmOsc  = AC.createOscillator();
      this.fmGain = AC.createGain();
      this.fmGain.gain.value = 0;

      this.fmOsc.connect(this.fmGain);
      this.fmGain.connect(this.osc.frequency);  // FM into carrier frequency
      this.osc.connect(this.filter);
      this.filter.connect(this.oscGain);
      this.oscGain.connect(masterGain);

      this.fmOsc.start();
      this.osc.start();

      this.syncAudio(true);
    } catch (e) { console.warn('Particle audio init:', e); }
  }

  syncAudio(immediate) {
    if (!this.osc || !AC) return;
    const t    = AC.currentTime;
    const tau  = immediate ? 0 : 0.05;
    const freq = warmthToFreq(this.warmth);
    const w    = this.warmth;

    // Carrier type
    this.osc.type = w < 0.33 ? 'sine' : w < 0.66 ? 'triangle' : 'sawtooth';

    // Carrier frequency + velocity detune
    const spd = Math.hypot(this.vx, this.vy);
    this.osc.frequency.setTargetAtTime(freq, t, tau);
    this.osc.detune.setTargetAtTime(spd * 5, t, 0.12);

    // FM modulator tracks half the carrier frequency
    this.fmOsc.frequency.setTargetAtTime(freq * 0.5, t, tau);

    // Bubble resonance filter
    const bubbleOn = document.getElementById('bubbleOn').checked;
    if (bubbleOn) {
      this.filter.frequency.setTargetAtTime(freq, t, 0.08);
      this.filter.Q.value = 14;
    } else {
      this.filter.frequency.value = 22050;
      this.filter.Q.value = 0.1;
    }

    // Amplitude from tension
    this.oscGain.gain.setTargetAtTime(this.tension * 0.1, t, tau);
  }

  // Called every frame from updateFM() — sets FM depth from proximity accumulator
  setFMDepth(depth) {
    if (!this.fmGain || !AC) return;
    this.fmGain.gain.setTargetAtTime(depth, AC.currentTime, 0.08);
  }

  destroy() {
    if (!this.osc) return;
    const t = AC.currentTime;
    try { this.oscGain.gain.setTargetAtTime(0, t, 0.015); } catch (_) {}
    setTimeout(() => {
      for (const node of [this.osc, this.fmOsc, this.fmGain, this.filter, this.oscGain]) {
        try { if (node) { node.stop && node.stop(); node.disconnect(); } } catch (_) {}
      }
    }, 100);
    this.osc = null; this.fmOsc = null;
  }
}

// ─────────────────────────────────────────────────────────────
// Physics
// ─────────────────────────────────────────────────────────────

const mouse = { x: null, y: null, down: false };
let proximityPairs = [];

function physics() {
  const grav  = parseFloat(document.getElementById('gravity').value);
  const wind  = parseFloat(document.getElementById('wind').value);
  const visc  = parseFloat(document.getElementById('viscosity').value);
  const bnc   = parseFloat(document.getElementById('bounce').value);
  proximityPairs = [];

  for (const p of particles) {
    p.vy += grav;
    p.vx += wind;
    p.vx *= visc;
    p.vy *= visc;

    // Attractor
    if (mouse.down && mouse.x !== null) {
      const dx = mouse.x - p.x;
      const dy = mouse.y - p.y;
      const d  = Math.hypot(dx, dy) + 1;
      const f  = 400 / (d * d);
      p.vx += dx / d * f;
      p.vy += dy / d * f;
    }

    p.x += p.vx;
    p.y += p.vy;

    if (p.x - p.r < 0)  { p.x = p.r;     p.vx *= -bnc; }
    if (p.x + p.r > W)  { p.x = W - p.r; p.vx *= -bnc; }
    if (p.y - p.r < 0)  { p.y = p.r;     p.vy *= -bnc; }
    if (p.y + p.r > H)  { p.y = H - p.r; p.vy *= -bnc; }

    p.tension = Math.max(0.1, p.tension * 0.999);
    p.r       = 6 + p.tension * 10;
    p.syncAudio(false);
  }

  // Particle–particle
  for (let i = 0; i < particles.length - 1; i++) {
    for (let j = i + 1; j < particles.length; j++) {
      const a = particles[i], b = particles[j];
      const dx   = b.x - a.x, dy = b.y - a.y;
      const dist = Math.hypot(dx, dy);
      if (dist < 140) proximityPairs.push({ a, b, str: 1 - dist / 140 });
      resolveCollision(a, b, dx, dy, dist);
    }
  }
}

function resolveCollision(a, b, dx, dy, dist) {
  const minD = a.r + b.r;
  if (dist >= minD || dist < 0.01) return;

  const bnc   = parseFloat(document.getElementById('bounce').value);
  const nx    = dx / dist, ny = dy / dist;
  const ov    = (minD - dist) * 0.5;
  const invM  = 1 / (a.mass + b.mass);

  a.x -= nx * ov * b.mass * invM;
  a.y -= ny * ov * b.mass * invM;
  b.x += nx * ov * a.mass * invM;
  b.y += ny * ov * a.mass * invM;

  const dvx = a.vx - b.vx, dvy = a.vy - b.vy;
  const dot  = dvx * nx + dvy * ny;
  if (dot >= 0) return;

  const imp = (1 + bnc) * dot * invM;
  a.vx -= imp * b.mass * nx;  a.vy -= imp * b.mass * ny;
  b.vx += imp * a.mass * nx;  b.vy += imp * a.mass * ny;

  // Thermal exchange
  const wEx = (a.warmth - b.warmth) * 0.04;
  a.warmth  = Math.max(0, Math.min(1, a.warmth - wEx));
  b.warmth  = Math.max(0, Math.min(1, b.warmth + wEx));
  a.tension = Math.min(1, a.tension + 0.12);
  b.tension = Math.min(1, b.tension + 0.12);

  // Grain on collision
  const density  = parseFloat(document.getElementById('graindensity').value);
  const now      = performance.now();
  const minGap   = density > 0 ? 140 / density : Infinity;
  if (audioStarted && density > 0 && now - a.lastGrainTime > minGap) {
    a.lastGrainTime = now;
    const type = document.getElementById('graintype').value;
    spawnGrain(warmthToFreq((a.warmth + b.warmth) * 0.5), type);
  }
}

// ─────────────────────────────────────────────────────────────
// FM update (proximity-based, using each particle's dedicated fmOsc)
// ─────────────────────────────────────────────────────────────

function updateFM() {
  if (!audioStarted) return;
  const fmDepth = parseFloat(document.getElementById('fmdepth').value);

  // Reset accumulators
  for (const p of particles) p._fmAccum = 0;

  // Each proximity pair: modulate the higher-warmth (carrier) particle's FM depth
  for (const { a, b, str } of proximityPairs) {
    const carrier = a.warmth >= b.warmth ? a : b;
    const mod     = a.warmth >= b.warmth ? b : a;
    carrier._fmAccum += warmthToFreq(mod.warmth) * 0.5 * str * fmDepth * 0.15;
  }

  // Apply
  for (const p of particles) p.setFMDepth(p._fmAccum || 0);
}

// ─────────────────────────────────────────────────────────────
// Rendering
// ─────────────────────────────────────────────────────────────

function draw() {
  // Motion blur background
  ctx.fillStyle = 'rgba(8,12,16,0.22)';
  ctx.fillRect(0, 0, W, H);

  // Proximity lines
  ctx.lineCap = 'round';
  for (const { a, b, str } of proximityPairs) {
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.lineTo(b.x, b.y);
    ctx.strokeStyle = `rgba(40,160,255,${str * 0.18})`;
    ctx.lineWidth   = str * 1.5;
    ctx.stroke();
  }

  // FM resonance rings (strong proximity pairs)
  for (const { a, b, str } of proximityPairs) {
    if (str < 0.55) continue;
    const carrier = a.warmth >= b.warmth ? a : b;
    ctx.beginPath();
    ctx.arc(carrier.x, carrier.y, carrier.r + str * 22, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(60,200,255,${(str - 0.55) * 0.14})`;
    ctx.lineWidth   = 0.6;
    ctx.stroke();
  }

  // Attractor indicator
  if (mouse.down && mouse.x !== null) {
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 18, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(40,160,255,0.4)';
    ctx.lineWidth   = 1;
    ctx.stroke();
    ctx.beginPath();
    ctx.arc(mouse.x, mouse.y, 5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(40,160,255,0.6)';
    ctx.fill();
  }

  // Particles
  for (const p of particles) {
    const spd = Math.hypot(p.vx, p.vy);

    // Velocity trail
    if (spd > 0.4) {
      ctx.beginPath();
      ctx.moveTo(p.x, p.y);
      ctx.lineTo(p.x - p.vx * 5, p.y - p.vy * 5);
      ctx.strokeStyle = warmthToColor(p.warmth, 0.22);
      ctx.lineWidth   = p.r * 0.5;
      ctx.lineCap     = 'round';
      ctx.stroke();
    }

    // Outer glow
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r * 1.45, 0, Math.PI * 2);
    ctx.fillStyle = warmthToColor(p.warmth, 0.08);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = warmthToColor(p.warmth, 0.9);
    ctx.fill();

    // Specular highlight
    ctx.beginPath();
    ctx.arc(p.x - p.r * 0.22, p.y - p.r * 0.22, p.r * 0.32, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.18)';
    ctx.fill();
  }
}

const scopeBuf = new Float32Array(2048);

function drawScope() {
  sctx.fillStyle = '#050810';
  sctx.fillRect(0, 0, W, 60);

  // Centre line
  sctx.beginPath();
  sctx.moveTo(0, 30); sctx.lineTo(W, 30);
  sctx.strokeStyle = '#1a2535';
  sctx.lineWidth   = 1;
  sctx.stroke();

  if (analyser) {
    analyser.getFloatTimeDomainData(scopeBuf);
    const step = Math.max(1, Math.floor(scopeBuf.length / W));
    sctx.beginPath();
    for (let x = 0; x < W; x++) {
      const v = scopeBuf[x * step] || 0;
      const y = 30 + v * 24;
      x === 0 ? sctx.moveTo(x, y) : sctx.lineTo(x, y);
    }
    sctx.strokeStyle = 'rgba(40,180,255,0.85)';
    sctx.lineWidth   = 1.5;
    sctx.stroke();
  }

  sctx.fillStyle = '#2a4060';
  sctx.font      = '9px Courier New';
  sctx.fillText('OSCILLOSCOPE', 8, 11);
}

// ─────────────────────────────────────────────────────────────
// Particle management
// ─────────────────────────────────────────────────────────────

function spawnParticle(x, y) {
  if (particles.length >= MAX_P) return;
  const p = new Particle(
    x !== undefined ? x : 50 + Math.random() * (W - 100),
    y !== undefined ? y : 50 + Math.random() * (H - 100),
    Math.random(),
    Math.random() * 0.6 + 0.2
  );
  particles.push(p);
  document.getElementById('pcount').textContent = particles.length;
  document.getElementById('addBtn').disabled = particles.length >= MAX_P;
}

function initParticles(n) {
  for (const p of particles) p.destroy();
  particles.length = 0;
  for (let i = 0; i < n; i++) spawnParticle();
}

// ─────────────────────────────────────────────────────────────
// Audio init
// ─────────────────────────────────────────────────────────────

function initAudio() {
  if (audioStarted) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();

    masterGain = AC.createGain();
    masterGain.gain.value = 0.6;

    limiter = AC.createDynamicsCompressor();
    limiter.threshold.value = -6;
    limiter.knee.value      = 3;
    limiter.ratio.value     = 20;
    limiter.attack.value    = 0.001;
    limiter.release.value   = 0.1;

    reverb     = buildReverb(AC);
    reverbGain = AC.createGain();
    reverbGain.gain.value = 0.35;

    analyser = AC.createAnalyser();
    analyser.fftSize = 2048;

    masterGain.connect(limiter);
    masterGain.connect(reverb);
    reverb.connect(reverbGain);
    reverbGain.connect(limiter);
    limiter.connect(analyser);
    analyser.connect(AC.destination);

    audioStarted = true;
    document.getElementById('audstat').textContent  = 'RUNNING';
    document.getElementById('startBtn').textContent = '■ AUDIO RUNNING';
    document.getElementById('startBtn').classList.add('running');

    for (const p of particles) p.initAudio();
  } catch (e) { console.error('AudioContext error:', e); }
}

// ─────────────────────────────────────────────────────────────
// UI
// ─────────────────────────────────────────────────────────────

const sliders = {
  gravity:'gv', wind:'wv', viscosity:'vv', bounce:'bv',
  fmdepth:'fv', graindensity:'gdv', mastervol:'mvv', reverbamt:'rvv'
};

for (const [id, lblId] of Object.entries(sliders)) {
  const el  = document.getElementById(id);
  const lbl = document.getElementById(lblId);
  lbl.textContent = parseFloat(el.value).toFixed(2);
  el.addEventListener('input', function () {
    lbl.textContent = parseFloat(this.value).toFixed(2);
    if (id === 'mastervol' && masterGain)
      masterGain.gain.setTargetAtTime(parseFloat(this.value), AC.currentTime, 0.05);
    if (id === 'reverbamt' && reverbGain)
      reverbGain.gain.setTargetAtTime(parseFloat(this.value), AC.currentTime, 0.05);
  });
}

document.getElementById('disturbBtn').addEventListener('click', () => {
  for (const p of particles) {
    p.vx      += (Math.random() - 0.5) * 18;
    p.vy      += (Math.random() - 0.5) * 18;
    p.tension  = Math.min(1, p.tension + 0.6);
  }
});

document.getElementById('addBtn').addEventListener('click', () => {
  if (!audioStarted) initAudio();
  spawnParticle();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  initParticles(12);
});

document.getElementById('startBtn').addEventListener('click', initAudio);

// Attractor — mouse
canvas.addEventListener('mousedown', e => {
  if (!audioStarted) initAudio();
  mouse.down = true;
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mousemove', e => {
  if (!mouse.down) return;
  const r = canvas.getBoundingClientRect();
  mouse.x = e.clientX - r.left;
  mouse.y = e.clientY - r.top;
});
canvas.addEventListener('mouseup',    () => { mouse.down = false; });
canvas.addEventListener('mouseleave', () => { mouse.down = false; });

// Attractor — touch
canvas.addEventListener('touchstart', e => {
  e.preventDefault();
  if (!audioStarted) initAudio();
  mouse.down = true;
  const r = canvas.getBoundingClientRect();
  mouse.x = e.touches[0].clientX - r.left;
  mouse.y = e.touches[0].clientY - r.top;
}, { passive: false });
canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  const r = canvas.getBoundingClientRect();
  mouse.x = e.touches[0].clientX - r.left;
  mouse.y = e.touches[0].clientY - r.top;
}, { passive: false });
canvas.addEventListener('touchend', () => { mouse.down = false; });

// ─────────────────────────────────────────────────────────────
// Main loop
// ─────────────────────────────────────────────────────────────

function loop() {
  physics();
  updateFM();
  draw();
  drawScope();
  requestAnimationFrame(loop);
}

initParticles(12);
loop();
</script>
</body>
</html>
